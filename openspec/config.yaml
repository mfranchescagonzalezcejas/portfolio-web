schema: spec-driven

context: |
  Project: portfolio-web
  Goal: Personal website / personal landing page (static, devdigi.dev)
  Stack: Astro 7.1.6 + React 19 + TypeScript 6.0.3 + Tailwind CSS 4.3 + Vite
  Architecture: Static output, component-based (Astro pages + React islands), i18n (en/es), Vercel hosting
  Testing: Vitest 4.1.9 + jsdom, @testing-library/react, @testing-library/jest-dom
  Style: ESLint 9 + @typescript-eslint + react-hooks, Prettier 3 + tailwind plugin, astro check + tsc --noEmit

testing:
  strict_tdd: false
  detected_at: 2026-07-31
  runner:
    available: true
    command: "npm run test"
    framework: "vitest"
  layers:
    unit:
      available: true
      tool: "vitest + @testing-library/react"
    integration:
      available: true
      tool: "vitest + jsdom"
    e2e:
      available: false
      tool: ""
  coverage:
    available: false
    command: ""
  quality:
    linter:
      available: true
      command: "npm run lint"
    type_checker:
      available: true
      command: "npm run typecheck"
    formatter:
      available: true
      command: "npm run format:check"

rules:
  proposal:
    - Include scope boundaries and rollback plan for risky changes.
  specs:
    - Use Given/When/Then scenarios.
    - Use RFC 2119 keywords (MUST, SHOULD, MAY).
  design:
    - Document architecture decisions and tradeoffs.
  tasks:
    - Group tasks by phase and keep each task session-sized.
  apply:
    - Follow existing repository patterns.
    tdd: false
    test_command: "npm run test"
  verify:
    test_command: "npm run test"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
