name: Deploy production to Vercel

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Verify tag points to current main
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin \
            '+refs/heads/main:refs/remotes/origin/main'
          tag_sha="$(git rev-parse --verify "${GITHUB_SHA}^{commit}")"
          main_sha="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          if [[ "$tag_sha" != "$main_sha" ]]; then
            echo "::error::Release tag does not point to current origin/main"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=22.12.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm run build

      - name: Run tests
        run: pnpm exec vitest run

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Run security audit
        run: pnpm audit --prod --audit-level=high

  deploy:
    needs: release-gate
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://www.devdigi.dev
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Revalidate tag points to current main
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin \
            '+refs/heads/main:refs/remotes/origin/main'
          tag_sha="$(git rev-parse --verify "${GITHUB_SHA}^{commit}")"
          main_sha="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          if [[ "$tag_sha" != "$main_sha" ]]; then
            echo "::error::Release tag does not point to current origin/main"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=22.12.0"

      - name: Install Vercel CLI
        run: pnpm dlx vercel@54.17.1 --version

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx vercel@54.17.1 pull --yes --environment=production

      - name: Build production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx vercel@54.17.1 build --prod

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx vercel@54.17.1 deploy --prebuilt --prod
